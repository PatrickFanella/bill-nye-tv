name: verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify with job-local pnpm
        run: |
          tool_dir=$(mktemp -d)
          trap 'rm -rf "$tool_dir"' EXIT
          npm install --prefix "$tool_dir" pnpm@10.33.0
          PATH="$tool_dir/node_modules/.bin:$PATH" make verify

  image:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish the deployable images for this revision
        env:
          REGISTRY_PAT: ${{ secrets.REGISTRY_PAT }}
          REGISTRY: git.subcult.tv/subculture-collective
        run: |
          set -euo pipefail
          test -n "$REGISTRY_PAT"
          auth_dir=$(mktemp -d)
          trap 'rm -rf "$auth_dir"' EXIT
          chmod 700 "$auth_dir"
          export DOCKER_BUILDKIT=1 DOCKER_CONFIG="$auth_dir/docker"
          printf '%s\n' '@subcult:registry=https://git.subcult.tv/api/packages/subculture-collective/npm/' > "$auth_dir/npmrc"
          docker build -f deploy/frontend.Dockerfile --secret id=npmrc,src="$auth_dir/npmrc" --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$REGISTRY/bill-nye-tv-frontend:$GITHUB_SHA" .
          IMAGES="$REGISTRY/bill-nye-tv-frontend:$GITHUB_SHA"
          printf '%s' "$REGISTRY_PAT" | docker login git.subcult.tv --username subcult-agent --password-stdin
          for image in $IMAGES; do
            docker push "$image"
            echo "published $(docker inspect --format '{{index .RepoDigests 0}}' "$image")"
          done
